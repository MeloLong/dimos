# Default profile for `dimos --rerun-open none run m20-dan-nav-sim`.
# Values are validated at blueprint import. Restart DimOS after editing this file.

m20mujocosimconnection:
  # Master switch for the RGB renderer. Keep enabled when publishing either image topic.
  enable_color: true

  # MuJoCo camera used to render the RGB image.
  color_camera_name: head_camera

  # Frame ID attached to published RGB camera metadata.
  color_frame_id: camera_optical

  # Horizontal pixel count for the front RGB renderer.
  width: 640

  # Vertical pixel count for the front RGB renderer.
  height: 360

  # RGB publication rate in frames per second. Point clouds use pointcloud_fps instead.
  fps: 10.0

  # Vertical field of view of the RGB camera, in degrees.
  color_fov_deg: 45.0

  # Publish RGB frames on the front color_image topic.
  publish_front_image: true

  # Publish the same RGB renderer on color_image_rear. Keep false because this model has no rear RGB camera.
  publish_rear_image: false

  # Master switch for synthetic lidar and point-cloud generation.
  enable_pointcloud: true

  # Airy uses a 360 x 90-degree hemispherical scan rather than a perspective depth image.
  pointcloud_scan_pattern: airy_hemisphere

  # Synthetic point-cloud publication rate in frames per second.
  pointcloud_fps: 2.0

  # Azimuth samples per simulated revolution and per Airy unit. The real sensor
  # emits many more points; 192 keeps the navigation simulation responsive.
  pointcloud_width: 192

  # Airy 96-beam mode. Exact beam angles remain device-calibration data.
  pointcloud_height: 96

  # Front and rear Airy mount frames combined into one robot-centric point cloud.
  pointcloud_camera_names:
    - lidar_front_camera # Front Airy ray origin.
    - lidar_rear_camera  # Rear Airy ray origin.

  # MuJoCo geometry groups visible to lidar rays. Groups 2 and 3 are excluded to avoid scanning the robot itself.
  pointcloud_geom_groups:
    - 0
    - 1

  # Keep the moving mocap person visible to RGB/lidar/point clouds without
  # allowing its kinematic, effectively infinite-mass body to push over M20.
  person_collision_enabled: false

  # Official Airy vertical field of view. Azimuth coverage is always 360 degrees
  # in airy_hemisphere mode.
  pointcloud_fov_deg: 90.0

  # Official Airy decoder minimum range.
  pointcloud_min_range_m: 0.1

  # Maximum retained depth hit distance in metres. The office profile uses
  # 10 m so background surfaces behind moving objects can contribute map rays.
  pointcloud_max_range_m: 10.0

  # Open3D voxel size used to downsample the merged point cloud, in metres.
  pointcloud_voxel_size: 0.05

m20movingobstacle:
  # Enable one person-shaped mocap obstacle in m20-simple-nav-sim.
  enabled: true

  # Fixed seed keeps pseudo-random route choices reproducible across test runs.
  seed: 20

  # Obstacle ground speed in metres per second. Keep low relative to the 2 Hz point cloud.
  speed_mps: 0.15

  # Pose publication rate. This controls visual smoothness, not point-cloud frequency.
  update_hz: 20.0

  # Start away from the default robot spawn at (-1, 1).
  initial_waypoint_index: 0

  # Ground-level mocap position expected by the existing person mesh.
  z_m: 0.0

  # Stop before the moving person comes within this centre-to-centre distance
  # of the robot. Physical person collisions remain disabled in MuJoCo.
  proximity_stop_distance_m: 0.9

  # Resume normal random walking after retreating beyond this distance. It must
  # be greater than the stop distance so sensor noise cannot toggle the state.
  proximity_resume_distance_m: 1.1

  # Time to hold the person stationary before reversing along a legal path edge.
  proximity_pause_s: 1.0

  # Validated office path from the existing MuJoCo person-follow scenarios.
  # At each point the obstacle randomly chooses the previous or next edge.
  waypoints:
    - [-3.35, -0.51]
    - [-2.60, 1.28]
    - [4.80, 0.21]
    - [4.14, -6.00]
    - [0.59, -3.79]

mlsplannernative:
  # Vertical planning envelope for the official M20 MJCF in its standing pose.
  robot_height: 0.7

  # Hard radial clearance from the robot centre to walls and map edges, in metres.
  # Includes margin beyond the M20 body's and wheels' maximum horizontal radius.
  wall_clearance_m: 0.5

replanningastarplanner:
  # Diagnostic switch: publish raw grid-cell A* output on /raw_path.
  # Enable only when comparing raw and smoothed paths in Rerun; it does not
  # alter the controller path. Disable during normal operation to reduce traffic.
  publish_raw_path: true

  # Select the costmap-aware bounded smoother. False uses the legacy unconstrained
  # moving average. Changing this setting requires restarting DimOS.
  constrained_path_smoothing_enabled: true

  # Maximum smoothing iterations, integer >= 0. More iterations can improve
  # convergence but increase planning latency; 0 returns uniformly resampled raw A*.
  path_smoothing_iterations: 40

  # Attraction to each original A* point, range [0.0, 1.0]. Increasing it keeps
  # the path closer to grid geometry but preserves more stair-stepping; decreasing
  # it lets neighbour smoothing dominate up to path_smoothing_max_deviation_m.
  path_smoothing_data_weight: 0.02

  # Neighbour/Laplacian smoothing strength, range [0.0, 0.5]. Increasing it removes
  # local bends more strongly; 0 disables neighbour smoothing. The 0.5 upper bound
  # protects the iterative update from unstable oscillation.
  path_smoothing_smoothness_weight: 0.45

  # Hard maximum displacement of each adjusted point from its matching raw A* point,
  # in metres, value >= 0. Larger values permit rounder but less route-faithful paths;
  # 0 disables geometric adjustment. Costmap checks still apply at every value.
  path_smoothing_max_deviation_m: 0.10

  # Distance in metres between costmap samples along candidate path segments, > 0.
  # Smaller values improve thin-obstacle detection but increase planning CPU time.
  # Keep this no larger than the 0.05 m costmap resolution; use 0.025 for stricter tests.
  path_smoothing_collision_sample_spacing_m: 0.05

  # Maximum permitted increase in mean costmap cost, value >= 0. Local point
  # updates compare against the matching raw neighborhood; final fractional
  # candidates compare against uniformly resampled raw A*. A value of 0 forbids
  # any increase. Lethal and out-of-map cells are always rejected.
  path_smoothing_max_cost_increase: 2.0

  # Fraction retained after each failed full-path validation, range (0.0, 1.0).
  # With 0.5, candidates retain 100%, 50%, 25%, then 12.5% of smoothing.
  path_smoothing_backtracking_factor: 0.5

  # Number of reduced-fraction retries after the full candidate, integer >= 0.
  # Three retries with factor 0.5 evaluate 1.0, 0.5, 0.25, and 0.125.
  path_smoothing_max_backtracking_steps: 3

  # Record physical metrics for raw and every alpha candidate without changing
  # the existing collision, cost, backtracking, or selected-path decision.
  path_smoothing_validator_shadow_enabled: true

  # Run the Stage 2 physical policy beside the legacy mean-cost decision and
  # record its selected alpha. This is diagnostic only while authoritative is false.
  path_smoothing_physical_validator_shadow_enabled: true

  # Keep false until Stage 2 batch, safety, and performance acceptance is complete.
  # False guarantees that the legacy-selected path remains the controller output.
  path_smoothing_physical_validator_authoritative_enabled: false

  # Maximum candidate loss of minimum obstacle clearance relative to raw A*,
  # in metres. 0.025 m is a provisional half-cell threshold under evaluation.
  path_smoothing_physical_validator_max_clearance_loss_m: 0.025

  # Maximum additional path length through unknown cells relative to raw A*,
  # in metres. Normal navigation currently evaluates a strict zero-increase rule.
  path_smoothing_physical_validator_max_unknown_length_increase_m: 0.0

  # Approximate spacing between final controller waypoints, in metres, > 0.
  # Smaller values preserve curves but increase message/controller work; larger
  # values reduce points but may under-represent tight bends.
  path_resample_spacing_m: 0.10
